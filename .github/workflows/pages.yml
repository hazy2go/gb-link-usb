# Publishes the web page (web/) and the breadboard drawing to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'docs/breadboard.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the decoder
        run: cd web && npm test
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/gbprinter.js _site/
          { echo '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'; cat docs/breadboard.html; } > _site/breadboard.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
